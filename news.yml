name: news-collector

on:
  #schedule:
  #  - cron: "*/30 * * * *"
  workflow_dispatch:

concurrency:
  group: news-collector
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - run: pip install -r requirements.txt

      # State lives in the cache, NOT in git. Committing a 70MB database
      # every 30 minutes would add ~3GB/day to the repo permanently.
      - name: Restore index
        uses: actions/cache/restore@v4
        with:
          path: |
            news.db
            seen.db
          key: news-index-${{ github.run_id }}
          restore-keys: news-index-

      - name: Warm index if empty
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          if [ ! -f news.db ]; then
            echo "cold start - backfilling 6h"
            python backfill.py 6
          fi

      - name: Run
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python run.py

      - name: Save index
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            news.db
            seen.db
          key: news-index-${{ github.run_id }}
